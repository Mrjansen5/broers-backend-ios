# XcodeGen spec — `xcodegen generate` makes BroersBackend.xcodeproj (the CI does this on the Mac runner).
name: BroersBackend
options:
  bundleIdPrefix: ca.snjco
  deploymentTarget:
    iOS: "15.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    minVersion: 125.0.0
    maxVersion: 200.0.0
targets:
  BroersBackend:
    type: application
    platform: iOS
    sources:
      - path: BroersBackend
    dependencies:
      - package: WebRTC
      - sdk: CallKit.framework
      - sdk: MediaPlayer.framework
      - sdk: WebKit.framework
    info:
      path: BroersBackend/Info.plist
      properties:
        CFBundleDisplayName: Broers Backend
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, voip]
        NSMicrophoneUsageDescription: "The Radio tab uses your microphone so your team can hear you through your headset."
        NSCameraUsageDescription: "Lets you take photos of receipts and notes inside Broers Backend."
        NSPhotoLibraryUsageDescription: "Lets you attach photos inside Broers Backend."
        WKAppBoundDomains: [broersbackend.snjco.ca]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.snjco.broersbackend
        PRODUCT_NAME: BroersBackend
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
